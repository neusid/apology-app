<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Meta 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
            overflow: hidden; /* Prevent scrollbar from moving button */
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .romantic-font { font-family: 'Dancing Script', cursive; }
        
        /* Floating hearts background */
        .floating-hearts {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .heart-particle {
            position: absolute;
            color: #f48fb1;
            font-size: 1.5rem;
            animation: floatUp 10s linear infinite;
            opacity: 0.6;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .main-card {
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            transition: all 0.5s ease-out;
        }
        
        #btn-no {
            transition: top 0.3s ease, left 0.3s ease;
        }

        .fade-in {
            animation: fadeIn 1.5s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .bounce-in {
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Background Hearts -->
    <div class="floating-hearts" id="floating-hearts"></div>

    <div id="card" class="main-card p-10 rounded-3xl shadow-2xl max-w-lg text-center mx-4 border border-pink-200 bounce-in">
        <div id="step-1">
            <h1 class="romantic-font text-5xl text-pink-600 mb-6 drop-shadow-sm">Halo Meta... 🌻</h1>
            <p class="text-xl text-gray-700 mb-8 leading-relaxed font-medium">
                Aku minta maaf banget ya kalau hari ini aku gak seperti biasanya dan mungkin udah bikin kamu annoying. 🥺<br><br>
                Kamu mau kan maafin aku?
            </p>
            
            <div class="flex flex-col sm:flex-row justify-center items-center gap-6 mt-8 h-20">
                <button onclick="acceptApology()" class="bg-gradient-to-r from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-110 transition-all duration-300 z-20">
                    Iya, Dimaafin ❤️
                </button>
                <button id="btn-no" class="bg-gray-200 text-gray-600 font-bold py-3 px-8 rounded-full shadow-md z-30 cursor-pointer">
                    Gak Mau! 😤
                </button>
            </div>
        </div>

        <div id="step-2" class="hidden fade-in">
            <h1 class="romantic-font text-6xl text-pink-600 mb-6 drop-shadow-sm">Terima Kasih Meta! 💕</h1>
            <div class="text-lg text-gray-700 leading-relaxed font-medium bg-pink-50 p-8 rounded-2xl border border-pink-100 shadow-inner">
                <p class="mb-4">Aku janji bakal lebih baik dan gak bikin kamu kesel lagi hari ini.</p>
                <p class="text-pink-500 font-bold text-xl mt-6 romantic-font tracking-wider">I Love You! ✨</p>
            </div>
        </div>
    </div>

    <script>
        // Generate floating background particles
        const heartsContainer = document.getElementById('floating-hearts');
        const heartSymbols = ['🌻', '✨', '🌻', '🌸']; // Tidak ada lagi lope-lope
        for(let i=0; i<15; i++) { // Mengurangi jumlah agar tidak terlalu ramai
            let heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 10 + 10) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            heartsContainer.appendChild(heart);
        }

        // Runaway Button Logic (Mobile Friendly & Constrained)
        const btnNo = document.getElementById('btn-no');
        
        function moveButton() {
            if (btnNo.style.position !== 'fixed') {
                const rect = btnNo.getBoundingClientRect();
                btnNo.style.position = 'fixed';
                btnNo.style.margin = '0';
                btnNo.style.left = rect.left + 'px';
                btnNo.style.top = rect.top + 'px';
                btnNo.style.zIndex = '50';
                setTimeout(dodge, 10);
            } else {
                dodge();
            }
        }
        
        function dodge() {
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;
            const card = document.getElementById('card');
            const cardRect = card.getBoundingClientRect();
            
            let currentX = parseFloat(btnNo.style.left) || 0;
            let currentY = parseFloat(btnNo.style.top) || 0;
            
            // Move within a small radius (e.g. 80px away)
            const jumpDistance = 80;
            const angle = Math.random() * 2 * Math.PI;
            let newX = currentX + Math.cos(angle) * jumpDistance;
            let newY = currentY + Math.sin(angle) * jumpDistance;
            
            // Limit the movement so it strictly stays around the card
            const padding = 20;
            let minX = cardRect.left - padding;
            let maxX = cardRect.right - btnWidth + padding;
            let minY = cardRect.top - padding;
            let maxY = cardRect.bottom - btnHeight + padding;
            
            // Also ensure it never leaves the screen bounds
            minX = Math.max(minX, 10);
            maxX = Math.min(maxX, window.innerWidth - btnWidth - 10);
            minY = Math.max(minY, 10);
            maxY = Math.min(maxY, window.innerHeight - btnHeight - 10);
            
            newX = Math.max(minX, Math.min(maxX, newX));
            newY = Math.max(minY, Math.min(maxY, newY));
            
            btnNo.style.left = newX + 'px';
            btnNo.style.top = newY + 'px';
        }

        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault(); // prevent the click from registering on touch
            moveButton();
        });

        // Accept Apology Logic
        function acceptApology() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            
            if (btnNo.style.position === 'fixed') {
                btnNo.style.display = 'none'; // hide the runaway button completely
            }
            
            // Continuous Confetti Explosion
            var duration = 5000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ffc0cb', '#ffb6c1', '#ff69b4', '#ffd700', '#ffeb3b']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ffc0cb', '#ffb6c1', '#ff69b4', '#ffd700', '#ffeb3b']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
